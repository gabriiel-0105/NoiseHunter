# Opcional. So use se houver Docker instalado e autorizado na maquina.
services:
  mysql:
    image: mysql:8.4
    container_name: noisehunter-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: noisehunter_atividade
      MYSQL_ROOT_PASSWORD: noisehunter123
    volumes:
      - noisehunter_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  noisehunter_mysql_data:

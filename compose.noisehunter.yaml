# Ambiente separado: nao altera o MySQL nem os servidores locais existentes.
name: noisehunter-demo
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: noisehunter_atividade
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_USER: noisehunter
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
    volumes:
      - mysql_demo_data:/var/lib/mysql
      - ./sql/01_criar_banco_atividade.sql:/docker-entrypoint-initdb.d/01_criar_banco_atividade.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/noisehunter_atividade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bahia
      DB_USER: noisehunter
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend

volumes:
  mysql_demo_data:
